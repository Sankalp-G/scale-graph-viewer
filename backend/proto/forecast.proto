syntax = "proto3";

package inference;

message InferenceRequest {
    repeated string stream_ids = 1;
    int32 num_records = 2;
}

message EdgeResult {
    string edge_id = 1;
    int32 count = 2;
    int32 classification = 3;
}

message EdgeResultList {
    repeated EdgeResult results = 1;
}

message InferenceResponse {
    bool success = 1;
    string message = 2;
    // Keys are horizon step indices ("0", "1", ...). Value is list of (edge_id, count, class) per horizon.
    map<string, EdgeResultList> edge_results = 3;
    // ISO 8601 datetime when this response is being returned.
    string timestamp = 4;
}

service InferenceService {
    rpc Run(InferenceRequest) returns (InferenceResponse);
}
