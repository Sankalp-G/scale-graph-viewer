syntax = "proto3";

package nowcast;

message NowcastRequest {
    repeated string camera_names = 1;
    float return_every_seconds = 2;
    int32 history_size = 3;
}

message ClassCounts {
    repeated int32 counts = 1;
}

message EdgeResult {
    string edge_id = 1;
    int32 count = 2;
    int32 classification = 3;
}

message EdgeResultList {
    repeated EdgeResult results = 1;
}

message StreamValue {
    string stream_name = 1;
    repeated int64 timestamps = 2;
    repeated ClassCounts values = 3;
    repeated EdgeResultList edge_results_per_timestep = 4;
}

message NowcastUpdate {
    string timestamp_datetime = 1;
    repeated EdgeResultList edge_results_per_timestep = 2;
}

service NowcastService {
    rpc Stream(NowcastRequest) returns (stream NowcastUpdate);
}
 
